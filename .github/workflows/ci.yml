name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build and Package Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # The production dependencies are bundled into the extension, so a
      # known vulnerability there fails the build.
      # Ignored advisories, each with the reason it does not apply:
      # GHSA-g3hv-75wg-m249 (minimatch, published 2026-10-30): affects
      # minimatch >= 7.0.0, < 11.0.1 with optimizationLevel >= 2. We bundle
      # minimatch 5.1.9 (via vscode-languageclient 9), which is outside that
      # range and has no optimizationLevel; bun audit reports it only as
      # "< 11.0.1". Forcing minimatch 11 would need Node 20 (VS Code 1.85 runs
      # Node 18). Revisit when vscode-languageclient moves off minimatch 5.
      - name: Audit bundled dependencies
        run: bun audit --prod --audit-level=moderate --ignore=GHSA-g3hv-75wg-m249

      # Dev-only tools (vsce, typescript) never ship; report, don't block.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: bun audit

      - name: Build extension
        run: bun run build

      - name: Package VSIX
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypilot-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error

  e2e:
    # A real VS Code 1.85 under xvfb: activation, command registration, the
    # verified engine download (PYPILOT_E2E_FRESH=1: no pypilot installed, so
    # activation must fetch and check the pinned engine) and the report panel.
    name: End-to-end (VS Code 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Cache the VS Code download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-1.85.0-${{ runner.os }}
      - name: Run the e2e suite
        env:
          PYPILOT_E2E_FRESH: "1"
        run: xvfb-run -a bun run e2e
