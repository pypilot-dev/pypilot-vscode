# bunfig.toml — Bun workspace configuration for pypilot-vscode.

[install]
# Pin exact versions for reproducible CI installs.
exact = true

[install.cache]
# Keep the global cache; don't disable it.
disable = false

[run]
# No shell-level quoting surprises — Bun runs scripts directly.
bun = true

[test]
# Unit tests run outside VS Code: give modules that import "vscode" a stub.
preload = ["./test/setup.ts"]
# The e2e suite runs inside VS Code (bun run e2e), never under bun test.
pathIgnorePatterns = ["e2e/**"]
